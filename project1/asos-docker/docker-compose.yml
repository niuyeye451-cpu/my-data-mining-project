services:
  # ==========================================
  # 数据库服务：MySQL
  # ==========================================
  db:
    image: mysql:8.0
    container_name: asos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: asos_db
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 任务 1：爬取首页男女装分类链接
  # ==========================================
  task1:
    image: asos-scraper
    depends_on:
      - db
    volumes:
      - ./task1.py:/app/task1.py
      - ./data:/app/data
    command: python task1.py

  # ==========================================
  # 任务 2：批量爬取打折裙装商品链接
  # ==========================================
  task2:
    image: asos-scraper
    depends_on:
      - db
    volumes:
      - ./task2.py:/app/task2.py
      - ./data:/app/data
    command: python task2.py

  # ==========================================
  # 任务 3：爬取商品详情并存入数据库
  # ==========================================
  task3:
    image: asos-scraper
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./task3.py:/app/task3.py
      - ./data:/app/data
    command: python -u task3.py

volumes:
  mysql_data:
